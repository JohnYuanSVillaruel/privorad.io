<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Privora | Register</title>
  
  <script>
    (function() {
      const savedTheme = localStorage.getItem('privora-theme') || 
        (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-bs-theme', savedTheme);
    })();
  </script>

  <link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg">
  <link href="../assets/css/bootstrap.min.css" rel="stylesheet">
  <link href="../assets/css/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
</head>
<body class="min-vh-100 d-flex flex-column justify-content-between">

  <!-- Top Navbar -->
  <header class="p-3 p-md-4">
    <div class="container-fluid d-flex justify-content-between align-items-center">
      <a href="../index.html" class="navbar-brand d-flex align-items-center gap-2 text-decoration-none">
        <i class="bi bi-qr-code-scan"></i>
        <span class="fw-bold">Privora</span>
      </a>

      <div class="d-flex align-items-center gap-2">
        <a href="../index.html" class="btn btn-sm btn-outline-secondary d-none d-sm-inline-flex align-items-center">
          <i class="bi bi-arrow-left me-1"></i> Home
        </a>
        <button class="theme-toggle-btn" id="themeToggle" type="button" aria-label="Toggle color theme">
          <i class="bi bi-moon-stars-fill"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Register Card Container -->
  <main class="container my-auto py-4">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4" style="max-width: 440px;">
        
        <div class="card p-4 shadow-sm">
          <div class="text-center mb-3">
            <div class="feature-icon mx-auto mb-2">
              <i class="bi bi-person-plus"></i>
            </div>
            <h4 class="fw-bold mb-1">Create Account</h4>
            <p class="text-slate small mb-3">Institutional Registration</p>
          </div>

          <form id="standaloneSignupForm" onsubmit="handleSignupSubmit(event)">
            <div class="row g-2 mb-2">
              <div class="col-6">
                <label for="firstName" class="form-label small">First name</label>
                <input type="text" class="form-control" id="firstName" placeholder="Juan" required>
              </div>
              <div class="col-6">
                <label for="lastName" class="form-label small">Last name</label>
                <input type="text" class="form-control" id="lastName" placeholder="Dela Cruz" required>
              </div>
            </div>

            <div class="mb-2">
              <label for="regEmail" class="form-label small">Institutional Email</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                <input type="email" class="form-control" id="regEmail" placeholder="user@university.edu" required>
              </div>
            </div>

            <div class="mb-2">
              <label for="regRole" class="form-label small">Select Role</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-person-badge"></i></span>
                <select class="form-select fw-semibold" id="regRole" required>
                  <option value="student" selected>Student</option>
                  <option value="teacher">Teacher / Faculty</option>
                  <option value="admin">System Administrator</option>
                </select>
              </div>
            </div>

            <div class="mb-3">
              <label for="regPassword" class="form-label small">Password</label>
              <input type="password" class="form-control" id="regPassword" value="••••••••" required>
            </div>

            <div class="form-check mb-3">
              <input class="form-check-input" type="checkbox" id="acceptTerms" required checked>
              <label class="form-check-label text-slate small" for="acceptTerms">
                I accept institutional terms
              </label>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 mb-3">
              Complete Registration <i class="bi bi-arrow-right ms-1"></i>
            </button>

            <div class="text-center">
              <span class="small text-slate">Already registered?</span>
              <a href="login.html" class="small fw-semibold text-decoration-none ms-1 text-brand">Sign In</a>
            </div>
          </form>
        </div>

      </div>
    </div>
  </main>

  <footer class="p-3 text-center text-slate small">
    <div class="container">
      <span>&copy; 2026 Privora. All rights reserved.</span>
    </div>
  </footer>

  <script src="../assets/js/bootstrap.bundle.min.js"></script>
  <script>
    (function() {
      const toggleBtn = document.getElementById('themeToggle');
      if (toggleBtn) {
        function updateIcon(theme) {
          toggleBtn.innerHTML = theme === 'dark' 
            ? '<i class="bi bi-sun-fill text-warning"></i>' 
            : '<i class="bi bi-moon-stars-fill"></i>';
        }
        updateIcon(document.documentElement.getAttribute('data-bs-theme') || 'light');
        toggleBtn.addEventListener('click', function() {
          const next = document.documentElement.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-bs-theme', next);
          localStorage.setItem('privora-theme', next);
          updateIcon(next);
        });
      }

      window.handleSignupSubmit = function(e) {
        e.preventDefault();
        const role = document.getElementById('regRole').value;
        const email = document.getElementById('regEmail').value;
        const first = document.getElementById('firstName').value || 'User';
        const last = document.getElementById('lastName').value || '';
        const name = `${first} ${last}`.trim();

        localStorage.setItem('privora_user_role', role);
        localStorage.setItem('privora_user_email', email);
        localStorage.setItem('privora_user_name', name);

        if (role === 'student') window.location.href = 'student-dashboard.html';
        else if (role === 'admin') window.location.href = 'admin-dashboard.html';
        else window.location.href = 'teacher-dashboard.html';
      };
    })();
  </script>
</body>
</html>
